name: Box build

# ServiceApp for an openATV 8.1 box (ARMv7 hard-float), cross compiled
# against the image's own feed packages; the result is a tarball of the
# plugin directory to copy onto a test box. See .github/boxbuild/build.sh.

on:
  push:
    branches: [ci/box-build]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  box:
    name: openATV 8.1 armv7 build
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Install packages
      run: |
        sudo apt-get update -q
        sudo apt-get install -y -q gcc-14-arm-linux-gnueabihf g++-14-arm-linux-gnueabihf \
          binutils-arm-linux-gnueabihf qemu-user autoconf automake libtool pkgconf gettext

    - name: Sysroot from the feed
      run: bash .github/boxbuild/build.sh sysroot

    - name: Toolchain
      run: bash .github/boxbuild/build.sh toolchain

    - name: Build
      run: bash .github/boxbuild/build.sh build

    - name: Symbols against enigma2
      run: bash .github/boxbuild/build.sh check

    - name: Package
      run: bash .github/boxbuild/build.sh package

    - uses: actions/upload-artifact@v4
      with:
        name: serviceapp-box
        path: ${{ runner.temp }}/dist/
        if-no-files-found: error
