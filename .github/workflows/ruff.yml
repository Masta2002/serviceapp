name: Ruff

# Lint of the Python plugin (src/plugin, Python 3 of the image).
#   - gate: ruff check with the [tool.ruff] settings of pyproject.toml
#     (E, F, W; tabs and long lines allowed) - fails the run
#   - advisory: the bug-focused rules of E2iPlayer's bug scan (bugbear,
#     pylint errors, ...) and pyflakes scope analysis - never fails, the
#     findings go to the job summary and appear as annotations

on:
  push:
    paths:
      - 'src/plugin/**.py'
      - 'pyproject.toml'
      - '.github/workflows/ruff.yml'
      - '.github/workflows/requirements-lint.txt'
  pull_request:
    paths:
      - 'src/plugin/**.py'
      - 'pyproject.toml'
      - '.github/workflows/ruff.yml'
      - '.github/workflows/requirements-lint.txt'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ruff-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: ruff check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - uses: actions/setup-python@v7
      with:
        python-version: '3.13'

    - name: Install tools
      run: python -m pip install -r .github/workflows/requirements-lint.txt

    - name: Ruff (gate)
      run: ruff check --output-format=github src/plugin

    - name: Bug-focused rules and pyflakes (advisory)
      if: ${{ !cancelled() }}
      run: |
        SEL='B012,B014,B015,B017,B018,B023,B033,B034,PLE,PLW0127,PLW0128,PLW0129,PLW0133,PLW0602,PLW0711,PLW1501,PLW3301,RUF018,SIM222,SIM223'
        {
          echo '## Ruff bug-focused rules (advisory)'
          echo '```'
          ruff check src/plugin --exit-zero --output-format=concise --select "$SEL"
          echo '```'
          echo '## Pyflakes (advisory)'
          echo '```'
          python -m pyflakes src/plugin || true
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"
        ruff check src/plugin --exit-zero --output-format=github --select "$SEL"
