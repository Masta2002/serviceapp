name: Compile check

# Compiles the C++ sources against the enigma2 headers of openATV and checks
# the Python files. Nothing is linked: libenigma2 is not available here.
# (build.yml does the full autotools build; this one is the fast check with
# the flags fixed, independent of configure.)

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: compile-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y g++ pkg-config python3-dev libsigc++-3.0-dev \
          libuchardet-dev libssl-dev libfreetype-dev libfribidi-dev libxml2-dev

    - name: enigma2 and libdvbsi++ headers
      run: |
        git clone --depth 1 https://github.com/openatv/enigma2 e2
        git clone --depth 1 https://github.com/oe-alliance/libdvbsi dvbsi
        touch e2/config.h

    - name: Compile
      run: |
        FLAGS="-std=gnu++20 -fsyntax-only -Wall -Wno-unused -DDEBUG -DHAVE_EPG -DOPENPLI_ISERVICE_VERSION=2 \
          $(python3-config --includes) -include Python.h \
          $(pkg-config --cflags sigc++-3.0 uchardet openssl freetype2 fribidi) \
          -Ie2 -Ie2/include -Idvbsi/include -Isrc/serviceapp"
        rc=0
        for f in src/serviceapp/*.cpp src/serviceapp/subtitles/*.cpp; do
          echo "== $f"
          g++ $FLAGS "$f" || rc=1
        done
        gcc -fsyntax-only -Wall src/serviceapp/cJSON/cJSON.c || rc=1
        exit $rc

    # the code behind HAVE_SERVICE_BITRATE (sVideoBitrate / sAudioBitrate of
    # OpenViX and BlackHole) against the OpenViX headers
    - name: Compile with the OpenViX headers (live bit rate)
      run: |
        git clone --depth 1 -b Developer https://github.com/OpenViX/enigma2 vix
        touch vix/config.h
        g++ -std=gnu++20 -fsyntax-only -Wall -Wno-unused -DDEBUG -DHAVE_EPG -DOPENPLI_ISERVICE_VERSION=2 -DHAVE_SERVICE_BITRATE \
          $(python3-config --includes) -include Python.h \
          $(pkg-config --cflags sigc++-3.0 uchardet openssl freetype2 fribidi) \
          -Ivix -Ivix/include -Idvbsi/include -Isrc/serviceapp src/serviceapp/serviceapp.cpp

  python:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        # the Python 3 of openATV 7.x / 8.x images and the next one
        python: ['3.12', '3.13', '3.14']
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: ${{ matrix.python }}
        allow-prereleases: true

    - name: py_compile
      run: python -W error -m py_compile src/plugin/*.py
