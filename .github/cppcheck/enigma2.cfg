<?xml version="1.0"?>
<!--
  cppcheck library for the enigma2 macros and functions ServiceApp uses.
  cppcheck runs without the enigma2 headers (too slow, too noisy), so the
  macros are given here; without them CONNECT() is read as a null pointer
  dereference and DEFINE_REF() stops the analysis of serviceapp.cpp.
  Definitions follow openatv/enigma2 lib/base/object.h, lib/base/eerror.h.
-->
<def format="2">
  <define name="CONNECT(_signal, _slot)" value="_signal.connect(sigc::mem_fun(*this, &amp;_slot))"/>
  <define name="DECLARE_REF(x)" value="public: void AddRef(); void Release(); private: oRefCount ref;"/>
  <define name="DEFINE_REF(c)" value="void c::AddRef() { } void c::Release() { }"/>
  <define name="SWIG_VOID(x)" value="x"/>
  <define name="SWIG_OUTPUT" value="output"/>
  <define name="SWIG_PYOBJECT(x)" value="PyObject*"/>
  <!-- Python C API (Python.h is not parsed either) -->
  <define name="Py_RETURN_NONE" value="return Py_None"/>
  <define name="Py_RETURN_TRUE" value="return Py_True"/>
  <define name="Py_RETURN_FALSE" value="return Py_False"/>
  <!-- printf-like log functions: format strings are checked -->
  <function name="eDebug,eWarning,eLog,eDebugNoNewLine,eDebugNoNewLineStart,eFatal">
    <noreturn>false</noreturn>
    <leak-ignore/>
    <formatstr/>
    <arg nr="1" direction="in">
      <formatstr/>
      <not-uninit/>
    </arg>
  </function>
</def>
