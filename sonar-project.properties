# SonarCloud project configuration (project Masta2002_serviceapp).
#
# The project runs in Automatic Analysis mode. Only analysis-scope keys are
# reliably honoured from this file (sonar.sources, sonar.exclusions, ...);
# per-rule ignores may have to be set in Project Settings -> Analysis Scope
# on sonarcloud.io. .github/workflows/sonarcloud.yml takes over when the
# project is switched to CI-based analysis (steps in that file).
sonar.projectName=ServiceApp

sonar.sources=src
sonar.sourceEncoding=UTF-8

# Third-party code vendored verbatim (cJSON) and generated or binary files:
# not ours to fix, pure analysis noise
sonar.exclusions=\
  src/serviceapp/cJSON/**,\
  src/locale/**,\
  **/__pycache__/**

# the test program of the HLS parser
sonar.tests=test

# no coverage report is uploaded; without this the quality gate fails
# every branch and pull request on "coverage on new code"
sonar.coverage.exclusions=**
