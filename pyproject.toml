[tool.ruff]
# src/plugin runs on the enigma2 Python 3 of the image (openATV 7.x/8.x: 3.12-3.14)
target-version = "py312"
line-length = 120
builtins = ["_", "ngettext"]

[tool.ruff.lint]
# same gate as E2iPlayer: pycodestyle errors/warnings + pyflakes
select = ["E", "F", "W"]
# W191 tabs (enigma2 style), E501 long skin/strings lines
ignore = ["W191", "E501"]

[tool.isort]
profile = "black"
line_length = 120
force_sort_within_sections = true
combine_as_imports = true
lines_between_types = 1
include_trailing_comma = true
multi_line_output = 3
force_single_line = false
default_section = "THIRDPARTY"
sections = ["STDLIB", "THIRDPARTY", "FIRSTPARTY", "LOCALFOLDER"]
known_third_party = ["Components", "Screens", "Tools"]
known_first_party = ["Plugins"]
no_lines_before = ["STDLIB"]
order_by_type = false
